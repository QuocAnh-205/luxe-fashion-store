services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luxe-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET}
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000}
    container_name: luxe-frontend
    ports:
      - "3000:80"
    environment:
      - PORT=80
    depends_on:
      - backend
    restart: always
